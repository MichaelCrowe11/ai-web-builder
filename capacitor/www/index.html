<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>AI Web Builder</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        height: 100%;
        background: #0b0b0c;
        color: #e8e2cf;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
        padding-top: calc(2rem + env(safe-area-inset-top));
        padding-bottom: calc(2rem + env(safe-area-inset-bottom));
        gap: 1.25rem;
      }
      .mark { width: 72px; height: 72px; }
      h1 { font-size: 1.4rem; font-weight: 500; letter-spacing: -0.01em; }
      p { font-size: 0.95rem; line-height: 1.5; color: #9a958a; max-width: 22rem; }
      button {
        margin-top: 0.5rem;
        background: #bfa669;
        color: #0b0b0c;
        border: 0;
        border-radius: 10px;
        padding: 0.75rem 1.5rem;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:active { opacity: 0.85; }
    </style>
  </head>
  <body>
    <!--
      Offline / first-paint fallback. The live app is served from server.url
      (https://ai-webbuilder.com). This screen only renders when the device has
      no network at launch — it keeps the app from showing a blank webview,
      which also gives App Review something branded to see if they test offline.
    -->
    <div class="wrap">
      <img class="mark" src="/favicon.svg" alt="Crowe Logic" />
      <h1>AI Web Builder</h1>
      <p>You're offline. AI Web Builder needs a connection to design and publish your site. Reconnect and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
