<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="AI Web Builder">
  <!-- Full-bleed ink field; iOS masks the corners, so no rounded rect here. -->
  <rect width="1024" height="1024" fill="#0b0b0c"/>
  <!-- Crowe mark: hexagon + open 'C', scaled to ~62% of the canvas and centered.
       Group maps the 64x64 favicon mark center (32,30) to (512,512) at 13.6x. -->
  <g transform="translate(76.8,104) scale(13.6)" vector-effect="non-scaling-stroke">
    <polygon points="32,9 50,19.5 50,40.5 32,51 14,40.5 14,19.5"
             fill="none" stroke="#e8e2cf" stroke-width="1.3" stroke-linejoin="miter"/>
    <path d="M41 24c-2.3-2.3-5.3-3.5-8.7-3.5-5.8 0-10.3 4.6-10.3 11s4.5 11 10.3 11c3.4 0 6.4-1.2 8.7-3.5"
          fill="none" stroke="#bfa669" stroke-width="2.6" stroke-linecap="square"/>
  </g>
</svg>
