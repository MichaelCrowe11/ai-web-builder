<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Trellis">
  <!-- Trellis mark on a graphite tile so it holds on light browser chrome too.
       Four strokes and a node: anything denser dissolves below 24px. -->
  <rect width="64" height="64" rx="14" fill="#0a0a0b"/>
  <g transform="translate(32 32) scale(0.8) translate(-24 -24)">
    <g fill="none" stroke="#f5f2ea" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 2 L46 24 L24 46 L2 24 Z"/>
      <path d="M13 13 L35 35"/>
      <path d="M35 13 L13 35"/>
    </g>
    <circle cx="24" cy="24" r="4.4" fill="#EFA71B"/>
  </g>
</svg>
