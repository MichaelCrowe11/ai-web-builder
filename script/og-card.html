<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  Source for client/public/og.png, the 1200x630 social card.

  Kept as HTML and shot in a browser rather than drawn as an SVG, because the
  card has to be set in the real Fraunces and the real JetBrains Mono. Any
  other route approximates the brand faces, and the social card is the one
  brand asset that appears where nobody has our stylesheet.

  Regenerate: python3 script/og-shot.py
-->
<style>
  @font-face { font-family:"Fraunces"; src:url("../client/public/fonts/fraunces-var.woff2") format("woff2-variations"); font-weight:100 900; font-display:block; }
  @font-face { font-family:"Inter"; src:url("../client/public/fonts/inter-var.woff2") format("woff2-variations"); font-weight:100 900; font-display:block; }
  @font-face { font-family:"JetBrains Mono"; src:url("../client/public/fonts/jetbrains-mono-var.woff2") format("woff2-variations"); font-weight:100 800; font-display:block; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; }
  body { background:#0a0a0b; color:#e9e9ec; font-family:"Inter",sans-serif; position:relative; overflow:hidden; }
  /* One restrained light source, upper left, so the card is not a flat fill. */
  .glow { position:absolute; inset:0;
    background:
      radial-gradient(760px 420px at 14% -8%, rgba(59,130,246,.16), transparent 62%),
      radial-gradient(600px 380px at 88% 112%, rgba(168,85,247,.07), transparent 60%); }
  .bevel { position:absolute; top:0; left:0; right:0; height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.16) 22%,rgba(255,255,255,.16) 78%,transparent); }
  .frame { position:relative; height:100%; padding:72px 84px; display:flex; flex-direction:column; }
  .top { display:flex; align-items:center; gap:16px; }
  .name { font-family:"Fraunces",serif; font-weight:500; font-size:31px; letter-spacing:-.01em; color:#f5f2ea; }
  .rule-v { width:1px; height:26px; background:rgba(59,130,246,.35); }
  .eyebrow { font-family:"JetBrains Mono",monospace; font-size:14px; font-weight:500;
    letter-spacing:.22em; text-transform:uppercase; color:#7dd3fc; }
  h1 { font-family:"Fraunces",serif; font-weight:500; font-size:76px; line-height:1.05;
    letter-spacing:-.02em; color:#f5f2ea; margin-top:auto; }
  p { font-size:24px; line-height:1.5; color:#a3a097; margin-top:20px; max-width:840px; }
  .rule { height:1px; background:rgba(59,130,246,.24); margin:36px 0 24px; }
  .foot { display:flex; align-items:center; justify-content:space-between; }
  .sig { display:flex; align-items:center; gap:16px; }
  .sig span { font-family:"JetBrains Mono",monospace; font-size:13px; letter-spacing:.2em;
    text-transform:uppercase; color:#4c7fe0; }
  .sig img { width:146px; display:block; opacity:.9; }
  .url { font-family:"JetBrains Mono",monospace; font-size:16px; letter-spacing:.1em; color:#6f6d66; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="bevel"></div>
  <div class="frame">
    <div class="top">
      <svg width="48" height="48" viewBox="0 0 48 48">
        <defs><linearGradient id="og" x1="6" y1="44" x2="40" y2="6" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#2563eb"/><stop offset=".5" stop-color="#38bdf8"/><stop offset="1" stop-color="#a855f7"/>
        </linearGradient></defs>
        <path d="M8 42 L20.5 8 L33 42" fill="none" stroke="url(#og)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M26.5 42 L37 20" fill="none" stroke="#7dd3fc" stroke-width="5.5" stroke-linecap="round"/>
        <path d="M40 6 l1.5 3.6 3.6 1.5 -3.6 1.5 -1.5 3.6 -1.5 -3.6 -3.6 -1.5 3.6 -1.5 z" fill="#e0f2fe"/>
      </svg>
      <div class="name">AI Web Builder</div>
      <div class="rule-v"></div>
      <div class="eyebrow">The living site</div>
    </div>

    <h1>Describe your business.<br>Get a website that's live.</h1>
    <p>Then it keeps testing itself, keeps the versions that win, and converts better over time without you touching it.</p>

    <div class="rule"></div>
    <div class="foot">
      <div class="sig">
        <span>A product of</span>
        <img src="../client/public/brand/crowe-logic-wordmark.svg" alt="Crowe Logic">
      </div>
      <div class="url">ai-webbuilder.com</div>
    </div>
  </div>
</body>
</html>
